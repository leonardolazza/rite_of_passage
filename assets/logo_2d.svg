<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Rite of Passage">
  <title>Rite of Passage</title>
  <defs>
    <style>
      .ink   { fill:none; stroke:#f2e9d8; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; }
      .ink-t { fill:none; stroke:#f2e9d8; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .flame { fill:#c8262f; }
      .flame-in { fill:#c9a86a; }
      .txt   { fill:#f2e9d8; font-family:Georgia,'Times New Roman',serif; font-weight:400; }
    </style>
  </defs>

  <!-- ===== Corner arcs (subtle, like the original) ===== -->
  <g class="ink-t" opacity="0.55">
    <path d="M0 560 A120 120 0 0 1 120 440" />
    <path d="M0 560 A150 150 0 0 1 150 410" />
    <path d="M1200 560 A120 120 0 0 0 1080 440" />
    <path d="M1200 560 A150 150 0 0 0 1050 410" />
  </g>

  <!-- ===== Sun cross (above the arch) ===== -->
  <g>
    <circle class="ink" cx="600" cy="82" r="34" />
    <path class="ink-t" d="M600 48 V116 M566 82 H634" />
    <!-- rays -->
    <g class="ink-t">
      <path d="M600 38 V22" /><path d="M600 126 V142" />
      <path d="M556 82 H540" /><path d="M644 82 H660" />
      <path d="M571 53 L559 41" /><path d="M629 53 L641 41" />
      <path d="M571 111 L559 123" /><path d="M629 111 L641 123" />
    </g>
  </g>

  <!-- ===== Portal / arch ===== -->
  <g>
    <!-- pillars -->
    <path class="ink" d="M470 210 V382 M500 210 V382" />
    <path class="ink" d="M700 210 V382 M730 210 V382" />
    <!-- intrados & extrados -->
    <path class="ink" d="M470 210 A130 130 0 0 1 730 210" />
    <path class="ink" d="M445 210 A155 155 0 0 1 755 210" />
    <!-- capital & base lines -->
    <path class="ink" d="M445 210 H755" />
    <path class="ink" d="M445 382 H755" />
  </g>

  <!-- ===== Flame (centre of the arch) ===== -->
  <g>
    <path class="flame" d="M600 372
      C553 332 560 296 586 276
      C559 256 560 224 600 162
      C640 224 641 256 614 276
      C640 296 647 332 600 372 Z" />
    <path class="flame-in" d="M600 350
      C575 326 580 302 596 290
      C582 276 584 256 600 222
      C616 256 618 276 604 290
      C620 302 625 326 600 350 Z" />
  </g>

  <!-- ===== Infinity symbols (sides) ===== -->
  <g class="ink" transform="translate(362 286) scale(1.15)">
    <path d="M0 0 C-9 -13 -23 -13 -23 0 C-23 13 -9 13 0 0 C9 -13 23 -13 23 0 C23 13 9 13 0 0 Z" />
  </g>
  <g class="ink" transform="translate(838 286) scale(1.15)">
    <path d="M0 0 C-9 -13 -23 -13 -23 0 C-23 13 -9 -13 0 0 C9 -13 23 -13 23 0 C23 13 9 13 0 0 Z" />
  </g>

  <!-- ===== Wordmark ===== -->
  <text class="txt" x="600" y="486" text-anchor="middle" font-size="70" letter-spacing="12">RITE OF PASSAGE</text>
</svg>
